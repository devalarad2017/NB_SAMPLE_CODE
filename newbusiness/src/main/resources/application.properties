# Inbound param carrying the partner-supplied application number (business tracking key).
journey.application-number-param=${APPLICATION_NUMBER_PARAM:obj1.stringval6}

# PAS application-number source:
#   GENERATE = current (PAS dev WIP): send applicationId=0 on initial push, reuse the
#              generated number for the final push.
#   INBOUND  = future: use the inbound application number for both pushes (no generation).
pas.application-number.mode=${PAS_APPLICATION_NUMBER_MODE:GENERATE}

