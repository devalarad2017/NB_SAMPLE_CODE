# =============================================================================
# Insurance New Business Platform â application.properties
# Deployed on OpenShift Container Platform (OCP)
#
# OCP DEPLOYMENT NOTES:
#   Sensitive values (DB password, API tokens) come from OCP Secrets mounted
#   as environment variables. Never hardcode credentials here.
#   Non-sensitive config (URLs, pool sizes) come from OCP ConfigMap.
#
#   OCP ConfigMap example:
#     DB_HOST=postgres-service.insurance.svc.cluster.local
#     DB_PORT=5432
#     DB_NAME=newbusiness
#     ELIGIBILITY_API_URL=http://eligibility-service.insurance.svc.cluster.local/api/check
#
#   OCP Secret example (base64 encoded in secret yaml):
#     DB_PASSWORD=<base64>
#     PARTNER_A_TOKEN=<base64>
# =============================================================================

# ââ Server âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
server.port=7075
spring.application.name=bajajlife-newbusiness

# JDK 21 Virtual Threads (Spring Boot 3.2+):
# Tomcat serves each HTTP request on a virtual thread -> cheap, high concurrency for
# the fast 202-acknowledge path. The journey itself still runs on the BOUNDED
# journeyTaskExecutor (@Async), which we deliberately keep as a load limiter /
# back-pressure for the downstream API calls. So this is purely additive.
spring.threads.virtual.enabled=true

# ââ OCP Health Probe endpoints âââââââââââââââââââââââââââââââââââââââââââââ
# OCP uses these for liveness and readiness probes.
# Liveness probe:  GET /actuator/health/liveness
# Readiness probe: GET /actuator/health/readiness
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ââ Database âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
# DB_HOST, DB_PORT, DB_NAME come from OCP ConfigMap
# DB_USERNAME, DB_PASSWORD come from OCP Secret
spring.datasource.url=jdbc:postgresql://${DB_HOST:172.20.99.158}:${DB_PORT:5432}/${DB_NAME:balic-dev}
spring.datasource.username=${DB_USERNAME:balicsiapp}
spring.datasource.password=${DB_PASSWORD:balicsiapp}
spring.datasource.driver-class-name=org.postgresql.Driver


# ââ HikariCP Connection Pool âââââââââââââââââââââââââââââââââââââââââââââââ
# OCP pods typically get 2-4 vCPUs. Pool sized accordingly.
# max-pool-size * pod replicas must not exceed DB max_connections.
# Example: 20 pool * 3 replicas = 60 connections max from this service.
spring.datasource.hikari.pool-name=NewBusinessPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# OCP pods can be killed and restarted â validate connections on borrow
#spring.datasource.hikari.connection-test-query=SELECT 1

