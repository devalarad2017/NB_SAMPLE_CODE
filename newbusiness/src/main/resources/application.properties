# =============================================================================
# Insurance New Business Platform - application.properties
# Deployed on OpenShift Container Platform (OCP)
#
# OCP DEPLOYMENT NOTES:
#   Sensitive values (DB password, API tokens) come from OCP Secrets mounted
#   as environment variables. Never hardcode credentials here.
#   Non-sensitive config (URLs, pool sizes) come from OCP ConfigMap.
#
#   OCP ConfigMap example:
#     DB_HOST=postgres-service.insurance.svc.cluster.local
#     DB_PORT=5432
#     DB_NAME=newbusiness
#     ELIGIBILITY_API_URL=http://eligibility-service.insurance.svc.cluster.local/api/check
#
#   OCP Secret example (base64 encoded in secret yaml):
#     DB_PASSWORD=<base64>
#     PARTNER_A_TOKEN=<base64>
# =============================================================================

# -- Server --------------------------------------------------------------------
server.port=8080
spring.application.name=bajajlife-newbusiness

# JDK 21 Virtual Threads (Spring Boot 3.2+):
# Tomcat serves each HTTP request on a virtual thread -> cheap, high concurrency for
# the fast 202-acknowledge path. The journey itself still runs on the BOUNDED
# journeyTaskExecutor (@Async), which we deliberately keep as a load limiter /
# back-pressure for the downstream API calls. So this is purely additive.
spring.threads.virtual.enabled=true

# -- OCP Health Probe endpoints ------------------------------------------------
# OCP uses these for liveness and readiness probes.
# Liveness probe:  GET /actuator/health/liveness
# Readiness probe: GET /actuator/health/readiness
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# -- Database ------------------------------------------------------------------
# DB_HOST, DB_PORT, DB_NAME come from OCP ConfigMap
# DB_USERNAME, DB_PASSWORD come from OCP Secret
spring.datasource.url=jdbc:postgresql://${DB_HOST:172.20.99.158}:${DB_PORT:5432}/${DB_NAME:balic-dev}?tcpKeepAlive=true
spring.datasource.username=${DB_USERNAME:balicsiapp}
spring.datasource.password=${DB_PASSWORD:balicsiapp}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- NGIN TOKEN CREDS -----------------------------------------------------
ngin.security.clientid=${NGIN_CLIENTID:osb_services}
ngin.security.client_secret=${NGIN_CLIENT_SECRET:4b58927b-056f-44e3-b918-a700236381cc}
rhsso.resource.path.url=${RHSSO_URL:/auth/realms/internal/protocol/openid-connect/token}
oauth.rhsso.uri=${AUTH_SERVER_URL:https://secure-sso-rhsso-np.apps.ocplife-np.bajajlife.com}

# -- HikariCP Connection Pool --------------------------------------------------
# OCP pods typically get 2-4 vCPUs. Pool sized accordingly.
# max-pool-size * pod replicas must not exceed DB max_connections.
# Example: 20 pool * 3 replicas = 60 connections max from this service.
#temp comment start initial setup
#spring.datasource.hikari.pool-name=NewBusinessPool
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.maximum-pool-size=20
#spring.datasource.hikari.connection-timeout=30000
#spring.datasource.hikari.idle-timeout=600000
#spring.datasource.hikari.max-lifetime=1800000
#temp comment end
#=========================================================================================
spring.datasource.hikari.pool-name=NewBusinessPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
# Reduce lifetime so we recycle BEFORE any upstream idle timeout kicks in
# 10 min
spring.datasource.hikari.max-lifetime=600000
# 5 min (must be < max-lifetime)
spring.datasource.hikari.idle-timeout=300000
# Proactively ping idle connections so dead ones are found in background,
# not at borrow time (must be < max-lifetime, typically 30s–2min less)
# 2 min
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000

#=========================================================================================
# Inbound: don't let Spring's async default (30s) kill long journeys
spring.mvc.async.request-timeout=180000
server.tomcat.connection-timeout=180000
server.tomcat.keep-alive-timeout=180000
#=========================================================================================
# OCP pods can be killed and restarted - validate connections on borrow
#spring.datasource.hikari.connection-test-query=SELECT 1

