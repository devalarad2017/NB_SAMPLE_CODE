# Test profile: load the full Spring context against an in-memory H2 database so the
# context-load test verifies bean wiring WITHOUT needing the real PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:nbtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from the @Entity classes for the test run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Quieter logs during the test.
logging.level.org.springframework.retry=WARN
